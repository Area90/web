<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Área 90 Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>

<style>

/* ================= VARIABLES ================= */
:root{
  --verde:#9CFF00;
  --bg:#0d0d0d;
  --card:#171717;
  --text:white;
}

body.light{
  --bg:#f3f3f3;
  --card:white;
  --text:#111;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  backdrop-filter:blur(15px);
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 30px;
  z-index:1000;
  transition:.3s;
}

body.light header{
  background:rgba(255,255,255,.7);
}

.logo{
  height:55px;
  filter:drop-shadow(0 0 12px var(--verde));
  transition:.4s;
}

.logo:hover{
  transform:scale(1.08);
}

.modeBtn{
  background:var(--verde);
  border:none;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= HERO ================= */
.hero{margin-top:80px;}

.hero video{
  width:100%;
  height:60vh;
  object-fit:cover;
}

/* ================= MINI VIDEO ================= */
.miniVideo{
  position:fixed;
  bottom:20px;
  right:20px;
  width:260px;
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  display:none;
  z-index:1500;
  box-shadow:0 15px 35px rgba(0,0,0,.7);
}

.miniVideo video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= FILTROS ================= */
.filters{
  text-align:center;
  margin:30px 0;
}

.filters button{
  padding:10px 20px;
  margin:5px;
  border-radius:20px;
  background:var(--card);
  color:var(--text);
  border:none;
  cursor:pointer;
  transition:.2s;
}

.filters button:hover{
  background:var(--verde);
  color:black;
}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
  padding:20px 40px 120px;
}

/* ================= CARDS ================= */
.card{
  background:var(--card);
  border-radius:20px;
  padding:15px;
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--verde);
}

.card img{
  width:100%;
  border-radius:12px;
}

.stock{
  color:var(--verde);
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(15px);
  z-index:2000;
}

.modal-content{
  width:750px;
  max-width:95%;
  background:var(--card);
  border-radius:25px;
  padding:30px;
  display:flex;
  gap:30px;
  position:relative;
}

.modal img{
  width:300px;
  border-radius:18px;
}

.close{
  position:absolute;
  top:12px;
  right:18px;
  font-size:22px;
  cursor:pointer;
}

/* ================= TALLAS ================= */
.tallas{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.tallaBtn{
  padding:8px 14px;
  border-radius:10px;
  background:#222;
  border:1px solid #333;
  cursor:pointer;
  transition:.2s;
}

body.light .tallaBtn{
  background:#eee;
  border-color:#ccc;
}

.tallaBtn:hover,
.tallaBtn.active{
  background:var(--verde);
  color:black;
  font-weight:bold;
}

/* ================= WHATSAPP ================= */
.whatsapp{
  background:#25D366;
  padding:12px 20px;
  border-radius:14px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:15px;
}

</style>
</head>

<body>

<header>
  <img src="/ChatGPT_Image_18_ene_2026__21_12_17-removebg-preview.png" class="logo">
  <button class="modeBtn" onclick="toggleMode()">🌙</button>
</header>

<div class="hero">
  <video autoplay muted loop>
    <source src="publi.mp4">
  </video>
</div>

<div class="miniVideo" id="mini">
  <video autoplay muted loop>
    <source src="publi.mp4">
  </video>
</div>

<div class="filters">
  <button onclick="filtrar('all')">Todo</button>
  <button onclick="filtrar('seleccion')">Selecciones</button>
  <button onclick="filtrar('europa')">Europa</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close">✖</span>
    <img id="mImg">

    <div>
      <h2 id="mTitulo"></h2>
      <p id="mInfo"></p>

      <h4>Selecciona tu talla:</h4>
      <div id="tallasContainer" class="tallas"></div>

      <a id="mWsp" class="whatsapp" target="_blank">Comprar por WhatsApp</a>
    </div>
  </div>
</div>

<script>

/* ===== RESTAURAR MODO ===== */
if(localStorage.getItem("mode")==="light"){
  document.body.classList.add("light");
  document.querySelector(".modeBtn").innerText="☀️";
}

/* ===== TOGGLE MODE ===== */
function toggleMode(){
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  document.querySelector(".modeBtn").innerText = light ? "☀️" : "🌙";
  localStorage.setItem("mode", light ? "light" : "dark");
}

/* ===== MINI VIDEO ===== */
const mini=document.getElementById("mini");
window.addEventListener("scroll",()=>{
  mini.style.display = window.scrollY>350 ? "block":"none";
});

/* ===== PRODUCTOS ===== */
const productos=[
{id:1,nombre:"Real Madrid",cat:"europa",stock:6,tallas:"S-M-L-XL",img:"real.png"},
{id:2,nombre:"Barcelona",cat:"europa",stock:5,tallas:"S-M-L",img:"barca.png"},
{id:3,nombre:"RB Leipzig",cat:"europa",stock:4,tallas:"S-M-L",img:"leipzig.png"},
{id:4,nombre:"Bayern Munich",cat:"europa",stock:6,tallas:"M-L-XL",img:"bayern.png"},
{id:5,nombre:"Colombia",cat:"seleccion",stock:10,tallas:"S-M-L-XL",img:"colombia.png"},
{id:6,nombre:"Portugal Visitante",cat:"seleccion",stock:7,tallas:"S-M-L",img:"portugal.png"},
{id:7,nombre:"Italia",cat:"seleccion",stock:5,tallas:"M-L",img:"italia.png"},
{id:8,nombre:"Argentina",cat:"seleccion",stock:6,tallas:"S-M-L",img:"argentina.png"}
];

const grid=document.getElementById("grid");
const modal=document.getElementById("modal");
const tallasContainer=document.getElementById("tallasContainer");

let tallaSeleccionada="Sin seleccionar";

/* ===== RENDER ===== */
function render(){
  grid.innerHTML="";
  productos.forEach(p=>{
    grid.innerHTML+=`
    <div class="card ${p.cat}" onclick="abrir(${p.id})">
      <img src="${p.img}">
      <h3>${p.nombre}</h3>
      <div class="stock">Stock: ${p.stock}</div>
    </div>`;
  });
}
render();

/* ===== FILTRO ===== */
function filtrar(t){
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=(t==='all'||c.classList.contains(t))?'block':'none';
  });
}

/* ===== MODAL ===== */
function abrir(id){
  const p=productos.find(x=>x.id===id);

  mImg.src=p.img;
  mTitulo.innerText=p.nombre;
  mInfo.innerText=`Stock: ${p.stock}`;

  tallaSeleccionada="Sin seleccionar";
  tallasContainer.innerHTML="";

  p.tallas.split("-").forEach(t=>{
    const btn=document.createElement("div");
    btn.className="tallaBtn";
    btn.innerText=t;

    btn.onclick=()=>{
      document.querySelectorAll(".tallaBtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      tallaSeleccionada=t;
      actualizarLink(p.nombre);
    }
    tallasContainer.appendChild(btn);
  });

  actualizarLink(p.nombre);
  modal.style.display="flex";
}

function actualizarLink(nombre){
  const texto=`Hola quiero la camiseta ${nombre} talla ${tallaSeleccionada}`;
  mWsp.href=`https://wa.me/573236883981?text=${encodeURIComponent(texto)}`;
}

document.querySelector(".close").onclick=()=>modal.style.display="none";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none";}

</script>

</body>
</html>
