<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Área 90 Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>

<!-- ICONOS OFICIALES INSTAGRAM & TIKTOK -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ================= VARIABLES ================= */
:root{
  --verde:#9CFF00;
  --bg:#0d0d0d;
  --card:#171717;
  --text:white;
}

body.light{
  --bg:#f3f3f3;
  --card:white;
  --text:#111;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  backdrop-filter:blur(15px);
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  z-index:1000;
}

body.light header{
  background:rgba(255,255,255,.7);
}

.logo{
  height:48px;
  filter:drop-shadow(0 0 12px var(--verde));
}

.modeBtn{
  background:var(--verde);
  border:none;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= HERO ================= */
.hero{ margin-top:70px; }

.hero video{
  width:100%;
  height:50vh;
  object-fit:cover;
}

/* ================= MINI VIDEO ================= */
.miniVideo{
  position:fixed;
  bottom:20px;
  right:20px;
  width:260px;
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  display:none;
  z-index:1500;
  box-shadow:0 15px 35px rgba(0,0,0,.7);
}

.miniVideo video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= REDES SOCIALES ================= */
.socials{
  position:fixed;
  left:15px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:1600;
}

.social-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-decoration:none;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  transition:.3s;
}

.social-btn i{
  font-size:24px;
}

.social-btn:hover{
  transform:scale(1.1);
}

.social-ig{
  background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
}

.social-tt{
  background:#000;
  border:2px solid #25F4EE;
}

/* ================= FILTROS ================= */
.filters{
  text-align:center;
  margin:25px 10px;
}

.filters button{
  padding:8px 16px;
  margin:6px;
  border-radius:20px;
  background:var(--card);
  color:var(--text);
  border:none;
  cursor:pointer;
}

.filters button:hover{
  background:var(--verde);
  color:black;
}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:15px;
}

/* ================= CARDS ================= */
.card{
  background:var(--card);
  border-radius:18px;
  padding:12px;
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--verde);
}

.card img{
  width:100%;
  border-radius:12px;
}

.stock{
  color:var(--verde);
  font-size:.9rem;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.9);
  z-index:2000;
}

.modal-content{
  width:95%;
  max-width:800px;
  background:var(--card);
  border-radius:22px;
  padding:20px;
  display:flex;
  gap:20px;
  position:relative;
}

.modal img{
  width:260px;
  border-radius:16px;
}

.close{
  position:absolute;
  top:12px;
  right:16px;
  font-size:22px;
  cursor:pointer;
}

/* ================= TALLAS ================= */
.tallas{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.tallaBtn{
  padding:7px 12px;
  border-radius:10px;
  background:#222;
  border:1px solid #333;
  cursor:pointer;
}

body.light .tallaBtn{
  background:#eee;
  border-color:#ccc;
}

.tallaBtn.active,
.tallaBtn:hover{
  background:var(--verde);
  color:black;
  font-weight:bold;
}

/* ================= WHATSAPP ================= */
.whatsapp{
  background:#25D366;
  padding:12px 18px;
  border-radius:14px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:15px;
}

.whatsapp.disabled{
  opacity:.5;
  pointer-events:none;
  filter:grayscale(1);
}

/* ================= RESPONSIVE ================= */
@media (max-width:768px){
  .hero video{ height:35vh; }
  .miniVideo{
    width:160px;
    bottom:15px;
    right:15px;
  }
  .socials{
    left:10px;
    bottom:15px;
  }
  .modal-content{
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-height:90vh;
    overflow-y:auto;
  }
}

@media (min-width:1400px){
  .grid{
    max-width:1300px;
    margin:auto;
  }
}

</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
  <button class="modeBtn" onclick="toggleMode()">🌙</button>
</header>

<div class="hero">
  <video autoplay muted loop playsinline>
    <source src="publi.mp4">
  </video>
</div>

<div class="miniVideo" id="mini">
  <video autoplay muted loop playsinline>
    <source src="publi.mp4">
  </video>
</div>

<!-- REDES SOCIALES -->
<div class="socials">
  <a href="https://www.instagram.com/area90_col" target="_blank" class="social-btn social-ig">
    <i class="fa-brands fa-instagram"></i>
  </a>
  <a href="https://www.tiktok.com/@area.905?lang=es" target="_blank" class="social-btn social-tt">
    <i class="fa-brands fa-tiktok"></i>
  </a>
</div>

<div class="filters">
  <button onclick="filtrar('all')">Todo</button>
  <button onclick="filtrar('seleccion')">Selecciones</button>
  <button onclick="filtrar('europa')">Europa</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close">✖</span>
    <img id="mImg">
    <div>
      <h2 id="mTitulo"></h2>
      <p id="mInfo"></p>
      <h4>Selecciona tu talla</h4>
      <div id="tallasContainer" class="tallas"></div>
      <a id="mWsp" class="whatsapp disabled" target="_blank">Comprar por WhatsApp</a>
    </div>
  </div>
</div>

<script>

/* ===== MODO OSCURO ===== */
if(localStorage.getItem("mode")==="light"){
  document.body.classList.add("light");
  document.querySelector(".modeBtn").innerText="☀️";
}

function toggleMode(){
  document.body.classList.toggle("light");
  const light=document.body.classList.contains("light");
  document.querySelector(".modeBtn").innerText=light?"☀️":"🌙";
  localStorage.setItem("mode",light?"light":"dark");
}

/* ===== MINI VIDEO ===== */
const mini=document.getElementById("mini");
window.addEventListener("scroll",()=>{
  mini.style.display = window.scrollY>350 ? "block":"none";
});

/* ===== PRODUCTOS ===== */
const productos=[
{id:1,nombre:"Real Madrid",cat:"europa",stock:6,tallas:"S-M-L-XL",img:"real.png"},
{id:2,nombre:"Barcelona",cat:"europa",stock:5,tallas:"S-M-L-XL",img:"barca.png"},
{id:3,nombre:"RB Leipzig",cat:"europa",stock:4,tallas:"S-M-L-XL",img:"leipzig.png"},
{id:4,nombre:"Bayern Munich",cat:"europa",stock:6,tallas:"S-M-L-XL",img:"bayern.png"},
{id:5,nombre:"Colombia",cat:"seleccion",stock:10,tallas:"S-M-L-XL",img:"colombia.png"},
{id:6,nombre:"Portugal Visitante",cat:"seleccion",stock:7,tallas:"S-M-L-XL",img:"portugal.png"},
{id:7,nombre:"Italia",cat:"seleccion",stock:5,tallas:"S-M-L-XL",img:"italia.png"},
{id:8,nombre:"Argentina",cat:"seleccion",stock:6,tallas:"S-M-L-XL",img:"argentina.png"},
{id:9,nombre:"Alemania",cat:"seleccion",stock:6,tallas:"S-M-L-XL",img:"alemania.png"},
{id:10,nombre:"Portugal visitante",cat:"seleccion",stock:6,tallas:"S-M-L-XL",img:"portugal2.png"}
];

const grid=document.getElementById("grid");
const modal=document.getElementById("modal");
const tallasContainer=document.getElementById("tallasContainer");
const mWsp=document.getElementById("mWsp");

function render(){
  grid.innerHTML="";
  productos.forEach(p=>{
    grid.innerHTML+=`
    <div class="card ${p.cat}" onclick="abrir(${p.id})">
      <img src="${p.img}">
      <h3>${p.nombre}</h3>
      <div class="stock">Stock: ${p.stock}</div>
    </div>`;
  });
}
render();

function filtrar(t){
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=(t==="all"||c.classList.contains(t))?"block":"none";
  });
}

function abrir(id){
  const p=productos.find(x=>x.id===id);

  mImg.src=p.img;
  mTitulo.innerText=p.nombre;
  mInfo.innerText=`Stock: ${p.stock}`;

  tallasContainer.innerHTML="";
  mWsp.classList.add("disabled");
  mWsp.removeAttribute("href");

  p.tallas.split("-").forEach(t=>{
    const b=document.createElement("div");
    b.className="tallaBtn";
    b.innerText=t;
    b.onclick=()=>{
      document.querySelectorAll(".tallaBtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      const texto=`Hola quiero la camiseta ${p.nombre} talla ${t}`;
      mWsp.href=`https://wa.me/573236883981?text=${encodeURIComponent(texto)}`;
      mWsp.classList.remove("disabled");
    };
    tallasContainer.appendChild(b);
  });

  modal.style.display="flex";
}

document.querySelector(".close").onclick=()=>modal.style.display="none";
modal.onclick=e=>{ if(e.target===modal) modal.style.display="none"; };

</script>

</body>

</html>
